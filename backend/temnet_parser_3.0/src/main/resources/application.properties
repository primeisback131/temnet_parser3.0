# HTTP. The whole API lives under /api so the SPA and the backend can share
# one origin: the Vite dev server proxies /api to this port, and in production
# a reverse proxy does the same. Same origin means the session cookie and the
# CSRF token need no cross-site setup at all.
server.servlet.context-path=${API_CONTEXT_PATH:/api}

# Session cookie. Turn `secure` on as soon as the app is served over HTTPS
# (behind a TLS-terminating proxy it is the proxy that decides).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# Behind a reverse proxy set this to `native` (or `framework`) so the client
# address seen by the login rate limiter is the real one, not the proxy's.
# Leave `none` when clients reach the app directly: then X-Forwarded-For
# headers are attacker-controlled and must be ignored.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Login brute-force protection: failed attempts per login name and per client
# address within the lockout window; reaching either limit refuses further
# attempts until the window expires.
app.auth.max-failures-per-user=${AUTH_MAX_FAILURES_PER_USER:10}
app.auth.max-failures-per-ip=${AUTH_MAX_FAILURES_PER_IP:50}
app.auth.lockout=${AUTH_LOCKOUT:PT15M}

# Database connection. Override via environment variables (do NOT commit real
# secrets). The `root` defaults exist for a developer machine only; the app
# warns at startup while they are in use.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ejabberd}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
# Session time zone for reading the dump. archive.created_at is a TIMESTAMP:
# MariaDB stores it in UTC and hands it out in the SESSION zone, so without
# this every machine reads its own wall clock and the working-hour metrics
# drift between them (the office server once showed 19% off-hours messages
# against 4% here). A fixed offset, not a zone name: the server has no tz
# tables loaded. Changing it needs a full rebuild.
app.dump.timezone=${DUMP_TZ:+05:00}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP pools. The dump is read only by the sync job (one connection at a
# time); the analytics DB serves every request, and a dashboard load fires
# eight queries at once - size that pool for the number of concurrent users.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.pool-name=temnet-pool
app.analytics.pool-size=${ANALYTICS_DB_POOL_SIZE:16}

# Analytics DB owned by this app (normalized messages + tickets, accounts).
# Created automatically; the sync job fills it from the ejabberd dump.
app.analytics.url=${ANALYTICS_DB_URL:jdbc:mariadb://localhost:3306/temnet_analytics?createDatabaseIfNotExist=true}
app.analytics.username=${ANALYTICS_DB_USER:root}
app.analytics.password=${ANALYTICS_DB_PASSWORD:root}

# Dump -> analytics sync cadence (ISO-8601 durations).
app.sync.initial-delay=${SYNC_INITIAL_DELAY:PT30S}
app.sync.interval=${SYNC_INTERVAL:PT5M}

# Jids starting with this prefix are support operators.
app.operator-prefix=${OPERATOR_PREFIX:help}

# Time zones. ejabberd usually archives timestamps in UTC while the working
# hours (Mon-Fri 08:00-18:00, see BusinessTime) mean the desk's local day.
# Set both to have every timestamp converted at ingest, e.g. SOURCE_TZ=UTC and
# BUSINESS_TZ=Europe/Moscow; leave both empty to take timestamps as they are.
# Changing them requires a full rebuild of the analytics DB.
app.time.source-zone=${SOURCE_TZ:}
app.time.business-zone=${BUSINESS_TZ:}

# LLM classification: ambiguous reopen candidates (SAME/NEW) and problem
# categories the keyword dictionary could not assign. DISABLED by default:
# enabling it sends the text of client requests to a provider, which is a
# decision to make deliberately. Provider (LLM_PROVIDER):
#   claude-cli - the local Claude Code CLI on this machine's Claude
#                subscription (no API key, no per-token billing);
#   http       - any OpenAI-compatible chat-completions endpoint, needs
#                LLM_BASE_URL; e.g. Groq (https://api.groq.com/openai/v1,
#                model meta-llama/llama-4-scout-17b-16e-instruct, 30 req/min)
#                or Gemini (https://generativelanguage.googleapis.com/v1beta/openai,
#                model gemini-flash-latest, 10 req/min);
#   off        - no classification;
#   empty      - http when LLM_BASE_URL is set, otherwise off.
# The per-sync budget (shared by both classifiers, reopens first) keeps the
# LLM step inside the sync interval; concurrency is how many calls run at
# once; the pace (0 = unlimited, fine for claude-cli) caps the total rate
# for providers with a per-minute limit - Groq 30, Gemini 10. Answers are
# cached in llm_verdict / llm_category, so rebuilds never re-classify old cases.
app.llm.provider=${LLM_PROVIDER:claude-cli}
app.llm.max-per-sync=${LLM_MAX_PER_SYNC:60}
app.llm.concurrency=${LLM_CONCURRENCY:4}
app.llm.requests-per-minute=${LLM_RPM:0}
# Which tickets get a category from the model: other (only those the
# dictionary left in «Другое»), all (every finished ticket, the model wins),
# off.
app.llm.categories=${LLM_CATEGORIES:other}

# http provider.
app.llm.base-url=${LLM_BASE_URL:}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
# Optional HTTP proxy for LLM calls (host:port). The JDK http client ignores
# the system proxy, so a provider unreachable from this region needs it here.
app.llm.proxy=${LLM_PROXY:}

# claude-cli provider. Runs `claude -p` per call under the account logged in
# with `claude auth login` (ANTHROPIC_API_KEY is stripped from the child
# environment so the subscription is used, never the API). The subscription's
# rolling 5-hour usage window is shared with the owner's interactive work,
# so calls stop once its utilization crosses a ceiling: ceiling-busy while a
# Claude Code session transcript changed within busy-window (the owner is
# working), ceiling-idle otherwise. Pending items wait for a later run.
app.llm.claude-cli.command=${CLAUDE_CLI:claude}
app.llm.claude-cli.model=${LLM_CLAUDE_MODEL:claude-haiku-4-5}
app.llm.claude-cli.ceiling-idle=${LLM_CLAUDE_CEILING_IDLE:0.5}
app.llm.claude-cli.ceiling-busy=${LLM_CLAUDE_CEILING_BUSY:0.2}
app.llm.claude-cli.busy-window=${LLM_CLAUDE_BUSY_WINDOW:PT10M}
app.llm.claude-cli.timeout=${LLM_CLAUDE_TIMEOUT:PT2M}
# Scratch directory for the CLI (prompt files, empty MCP config); default is
# the system temp dir. Claude Code's state dir; default CLAUDE_CONFIG_DIR or
# ~/.claude.
app.llm.claude-cli.work-dir=${LLM_CLAUDE_WORK_DIR:}
app.llm.claude-cli.home=${LLM_CLAUDE_HOME:}

# First administrator, created only when the account table is empty. Leave
# empty to have a random password generated and written to the log once; that
# password is temporary and has to be replaced at the first login.
app.admin.initial-password=${APP_ADMIN_PASSWORD:}

# CORS. Empty = same origin only (the intended setup, see the context path
# above). Set to the frontend origin(s), comma-separated, only when the SPA is
# served from another host and cannot be proxied.
app.cors.allowed-origin=${CORS_ORIGIN:}

# Metrics response cache. The metric queries are heavy window-function scans
# over the archive, and historical data never changes - only "today" does, so
# a short TTL keeps the dashboard snappy without showing stale numbers.
spring.cache.type=caffeine
spring.cache.cache-names=timeseries,backlog,backlogTickets,heatmap,sla,resolution,reopens,alerts,categories,categoryTimeseries,summary,clients,operators,helpAccountReport,helpAccounts
spring.cache.caffeine.spec=expireAfterWrite=${METRICS_CACHE_TTL:10m},maximumSize=500
